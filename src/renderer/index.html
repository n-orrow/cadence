<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADENCE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="app">
<div class="window-controls">
    <button class="back-btn hidden">&#10094;</button>
    <button class="settings-btn">&#9881;</button>
</div>
<div class="timer-screen">
    <div class="phase-label">FOCUS</div>
    <div class="timer">45:00</div>
    <div class="controls"></div>
</div>
<div class="grace-container"></div>
<div class="settings-screen" style="display:none;">
    <div class="settings-home">
        <nav class="settings-nav">
            <p class="title">Settings</p>
            <button class="item" data-page="templates">Templates</button>
            <button class="item" data-page="appearance">Appearance</button>
            <button class="item" data-page="notifications">Notifications</button>
            <button class="item" data-page="integrations">Integrations</button>
        </nav>
    </div>
    <div class="settings-subpage" style="display:none;"></div>
</div>
<div class="phase-indicator" style="display:none;"></div>
<script src="renderer.js"></script>
</body>
</html>
