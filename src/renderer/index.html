<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADENCE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="app">
<button class="settings-btn">&#9881;</button>
<div class="timer-screen">
    <div class="phase-label">FOCUS</div>
    <div class="timer">45:00</div>
    <div class="controls"></div>
</div>
<div class="grace-container"></div>
<div class="settings-screen" style="display:none;">
    <div class="settings-home">
        <h1 class="settings-title">Settings</h1>
        <nav class="settings-nav">
            <button class="settings-nav__item" data-page="workday">Workday</button>
            <button class="settings-nav__item" data-page="templates">Templates</button>
            <button class="settings-nav__item" data-page="appearance">Appearance</button>
            <button class="settings-nav__item" data-page="notifications">Notifications</button>
            <button class="settings-nav__item" data-page="integrations">Integrations</button>
        </nav>
    </div>
    <div class="settings-subpage" style="display:none;"></div>
</div>
<script src="renderer.js"></script>
</body>
</html>
